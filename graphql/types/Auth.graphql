# Google Workspace Auth Types

# Mirrors google.GoogleConnectionStatus in types/google.types.ts.
# getConnectionStatus() can return DISCONNECTED, CONNECTED, TOKEN_EXPIRED or REVOKED;
# AUTHORIZING and PARTIAL_ACCESS are reserved for the incremental-consent flow.
enum GoogleConnectionStatus {
  DISCONNECTED
  AUTHORIZING
  CONNECTED
  TOKEN_EXPIRED
  REVOKED
  PARTIAL_ACCESS
}

type GoogleConnection {
  userId: String!
  status: GoogleConnectionStatus!
  email: String
  grantedScopes: [String!]!
  connectedAt: DateTime
  expiresAt: DateTime
}

type GoogleAuthUrl {
  url: String!
}

# Queries
extend type Query {
  googleConnectionStatus: GoogleConnection
  googleAuthUrl(scopes: [String!]): GoogleAuthUrl
}

# Mutations
extend type Mutation {
  googleDisconnect: Boolean
  googleRequestScopes(scopes: [String!]!): GoogleAuthUrl
}
