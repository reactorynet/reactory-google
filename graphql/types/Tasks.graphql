# Google Tasks Types

enum TaskStatus {
  NEEDS_ACTION
  COMPLETED
}

type GoogleTaskList {
  id: String!
  title: String!
  updated: String
  selfLink: String
  etag: String
}

type TaskLink {
  type: String
  description: String
  link: String
}

type GoogleTask {
  id: String!
  title: String!
  updated: String
  selfLink: String
  parent: String
  position: String
  notes: String
  status: TaskStatus!
  due: String
  completed: String
  deleted: Boolean
  hidden: Boolean
  links: [TaskLink!]
  etag: String
}

type GoogleTasksPaged {
  tasks: [GoogleTask!]!
  nextPageToken: String
}

input GoogleTaskInput {
  title: String!
  notes: String
  due: String
  status: TaskStatus
  parent: String
}

# Queries
extend type Query {
  googleTaskLists: [GoogleTaskList!]
  googleTaskList(taskListId: String!): GoogleTaskList
  googleTasks(taskListId: String!, showCompleted: Boolean, showHidden: Boolean, maxResults: Int, pageToken: String): GoogleTasksPaged
  googleTask(taskListId: String!, taskId: String!): GoogleTask
}

# Mutations
extend type Mutation {
  googleTaskListCreate(title: String!): GoogleTaskList
  googleTaskListUpdate(taskListId: String!, title: String!): GoogleTaskList
  googleTaskListDelete(taskListId: String!): Boolean
  googleTaskCreate(taskListId: String!, input: GoogleTaskInput!): GoogleTask
  googleTaskUpdate(taskListId: String!, taskId: String!, input: GoogleTaskInput!): GoogleTask
  googleTaskDelete(taskListId: String!, taskId: String!): Boolean
  googleTaskComplete(taskListId: String!, taskId: String!): GoogleTask
  googleTaskClearCompleted(taskListId: String!): Boolean
}
