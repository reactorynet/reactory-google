# Tool Includes
# ─────────────────────────────────────────────
tools:
  includes:
    # Filesystem — inspect local artifacts if needed
    - readFile
    - writeFile
    - listDirectory
    - mkdir
    # System graph & search
    - searchGraph
    - getGraphNode
    - graphChildren
    - exploreGraph
    - graphLinks
    - searchContent
    - listSearchIndexes
    - getIndexStats
    # Project cataloging
    - catalogProject
    - listProjects
    - getProject
    # Skills
    - searchSkills
    - readSkill
    # Cross-agent
    - chats
    # Task tracking
    - todo
    # Presentation & interaction
    - form
    - chart
    - d3
    - image
    # Session utilities
    - datetime
    - var
    - sliceVariable
    - updateChatData
    # Google Workspace macros (resolved from this module's reactor.macros)
    - GetConnectionStatus
    - SendEmail
    - SearchEmail
    - CreateCalendarEvent
    - ListCalendarEvents
    - SearchDrive
    - ReadSpreadsheet
    - CreateGoogleDoc
    - ListContacts
    - CreateTask

# ─────────────────────────────────────────────
# Macro Includes
# Names must match the `name` on the macros registered by this module
# (see src/modules/reactory-google/ai/macros/index.ts).
# ─────────────────────────────────────────────
macros:
  includes:
    - GetConnectionStatus
    - SendEmail
    - SearchEmail
    - CreateCalendarEvent
    - ListCalendarEvents
    - SearchDrive
    - ReadSpreadsheet
    - CreateGoogleDoc
    - ListContacts
    - CreateTask

