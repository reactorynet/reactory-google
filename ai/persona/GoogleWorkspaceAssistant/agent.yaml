# ─────────────────────────────────────────────
# Role Capabilities
# ─────────────────────────────────────────────
roleCapabilities:
  ADMIN: |
    Full Google Workspace access for the connected account: read and send email,
    manage calendars, browse and modify Drive, edit Docs and Sheets, manage contacts
    and tasks — including sharing/permission changes.
  USER: |
    Standard Google Workspace access for your own connected account: read and send
    email, manage your calendars, browse Drive, edit Docs and Sheets, manage your
    contacts and tasks.
  default: |
    You can ask the assistant to operate on your connected Google account once it is
    connected. Operations that require a connected account will prompt you to connect
    Google first.

