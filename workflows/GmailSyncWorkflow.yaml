nameSpace: google
name: GmailSyncWorkflow
version: 1.0.0
description: Sync Gmail messages for a user
tags: [google, gmail, sync]
steps:
  - id: getToken
    type: service_invoke
    config:
      service: "google.GoogleAuthService@1.0.0"
      method: "hasValidToken"
      params: {}
  - id: sync
    type: service_invoke
    config:
      service: "google.GmailService@1.0.0"
      method: "listMessages"
      params: {}
